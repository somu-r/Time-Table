<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Time Table</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@400..700&display=swap" rel="stylesheet">
<style>
TR,TD{
TEXT-ALIGN:CENTER;
WIDTH:120PX;
HEIGHT:50PX;
}
font{

  font-family: "Dancing Script", cursive;
  font-optical-sizing: auto;
  font-weight: weight;
  font-style: normal;
font-size:50px;
color:brown;
}
.co{
background-color:BLUE;
}
.PINK{
BACKGROUND-COLOR:#FF1493;
}
</style>
</head>
</head>
<body >

<center>
<font >Time Table</font>
<table BORDER="5"  STYLE="font-family:Sans-serif;border-color: WHITE;color:white;background-color:black;"cellpadding="5" CELLSPACING="5" >
<tr>
<th class="co" STYLE="FONT-SIZE:25PX;" ROWSPAN="2">DAY<br>ORDER</th>
<th COLSPAN="6" STYLE=" TEXT-ALIGN:center;background-color:red;COLOR:WHITE;FONT-SIZE:25PX">PERIOD</th>
</tr>

<tr>

<th CLASS="PINK">1</th>
<th  CLASS="PINK" >2</th>
<th  CLASS="PINK">3</th>
<th rowspan="7"  style="   writing-mode: tb;transform: rotate(-180deg);font-size:25px;BACKGROUND-COLOR:#27dbd0;COLOR:BLACK;width:100px" >TEA BREAK</th>

<th  CLASS="PINK">4</th>
<th   CLASS="PINK">5</th>
</tr>
<tr>
<td style="background-color:#0ea525">I</td>

<td  STYLE="TEXT-ALIGN:CENTER;">LS</td>
<td>PYTHON</td>
<td>IT</td>
<td>IT LAB</td>
<TD>EVS</TD>
</tr>
<tr>
<td style="background-color:#0ea525">II</td>

<td>LS</td>
<td>CN</td>
<td>PYTHON</td>
<td>IT</td>
<TD>CN</TD>
</tr>
<tr>
<td style="background-color:#0ea525">III</td>
<td>LS</td>
<td>CN</td>
<td>IT</td>
<td>PYTHON</td>

<TD>IT LAB</TD>
</tr>
<tr STYLE="HEIGHT:80PX;">

<td>IT</td>
<td>PYTHON<BR> LAB</td>
<td>IT LAB</td>
<td>EVS</td>
<TD>PYTHON</TD>
</tr>
<tr>
<td style="background-color:#0ea525;HEIGHT:80PX;">V</td>

<td>CN</td>
<td>IT LAB</td>
<td>PYTHON <BR>LAB</td>
<td>EVS</td>
<TD>IT</TD>
</tr>
<tr>
<td style="background-color:#0ea525">VI</td>

<td>CN</td>
<td>EVS</td>
<td>IT</td>
<td>CN</td>
<TD>IT LAB</TD>
</tr>
</table>
</center>

</html>
